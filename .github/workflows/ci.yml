name: SentinelX checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - database: sqlite
            url: ''
          - database: postgres
            url: postgresql+psycopg://sentinelx:test-only-password@localhost:5432/sentinelx_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sentinelx
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: sentinelx_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sentinelx -d sentinelx_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r backend/requirements.txt pip-audit
      - run: ruff check backend collectors scripts
      - run: ruff format --check backend collectors scripts
      - run: pytest -q scripts/tests
      - run: python ../scripts/check_runner_clock.py -- pytest -q
        working-directory: backend
        env:
          TEST_DATABASE_URL: ${{ matrix.url }}
      - run: pip-audit -r backend/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Build the isolated static showcase
        run: npm run build:showcase
      - run: npx playwright install --with-deps chromium
      - name: Showcase browser and network-isolation checks
        run: npm run test:showcase
      - run: npm audit --audit-level=high

  container-smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: python scripts/init_env.py
      - run: docker compose up --build --wait --wait-timeout 240
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser investigation workflow
        working-directory: frontend
        run: |
          export SENTINELX_E2E_PASSWORD=$(sed -n 's/^BOOTSTRAP_ADMIN_PASSWORD=//p' ../.env)
          echo "::add-mask::$SENTINELX_E2E_PASSWORD"
          npm run test:e2e
      - if: failure()
        run: docker compose ps --all
      # Never upload browser traces/videos/captures, which can contain fixture credentials.
      - if: always()
        run: docker compose down

  production-release:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install -r backend/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y age libnss3-tools
      - name: Install checksum-verified Trivy
        run: |
          curl -fsSL -o "$RUNNER_TEMP/trivy.tar.gz" https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz
          echo "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  $RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: One-day history, ten-minute 10 EPS soak, TLS, identity, failure, and restore gates
        run: python scripts/check_runner_clock.py -- python scripts/release_check.py --seconds 600 --history-events 864000 --keep
      - name: Container OS and language vulnerability gates
        run: |
          directory=$(find /tmp/opencode -maxdepth 1 -type d -name 'sentinelx-release-*' | head -n 1)
          python scripts/scan_release.py --artifact-dir "$directory"
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Trusted-CA production browser gate
        run: |
          directory=$(find /tmp/opencode -maxdepth 1 -type d -name 'sentinelx-release-*' | head -n 1)
          python scripts/browser_release_check.py --artifact-dir "$directory"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: production-fixture-reports
          path: |
            /tmp/opencode/sentinelx-release-*/report.json
            /tmp/opencode/sentinelx-release-*/container-scan-summary.json
      - name: Stop only the disposable release project
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          for report in pathlib.Path('/tmp/opencode').glob('sentinelx-release-*/report.json'):
              project = json.loads(report.read_text())['project']
              if not project.startswith('sentinelx-release-'):
                  raise RuntimeError('Refusing non-disposable project')
              command = ['docker','compose','--project-name',project,'--env-file',str(report.parent/'.env')]
              for file in ('docker-compose.yml','docker-compose.https.yml','docker-compose.production.yml','docker-compose.release-test.yml'):
                  command += ['-f',file]
              subprocess.run(command + ['down'],check=True)
          PY
