name: SentinelX checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - database: sqlite
            url: ''
          - database: postgres
            url: postgresql+psycopg://sentinelx:test-only-password@localhost:5432/sentinelx_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sentinelx
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: sentinelx_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sentinelx -d sentinelx_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r backend/requirements.txt pip-audit
      - run: ruff check backend collectors scripts
      - run: ruff format --check backend collectors scripts
      - run: pytest -q
        working-directory: backend
        env:
          TEST_DATABASE_URL: ${{ matrix.url }}
      - run: pip-audit -r backend/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  container-smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: python scripts/init_env.py
      - run: docker compose up --build --wait --wait-timeout 240
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser investigation workflow
        working-directory: frontend
        run: |
          export SENTINELX_E2E_PASSWORD=$(sed -n 's/^BOOTSTRAP_ADMIN_PASSWORD=//p' ../.env)
          npm run test:e2e
      - if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: browser-failures, path: frontend/test-results}
      - if: always()
        run: docker compose down
