# Free API with external Neon PostgreSQL and Upstash Redis.
# This service is managed directly; do not apply a duplicate Blueprint.
previews:
  generation: 'off'
services:
- type: web
  name: sentinelx-api
  runtime: docker
  repo: https://github.com/aadvik1864/sentinelx
  branch: main
  region: singapore
  plan: free
  dockerContext: .
  dockerfilePath: backend/Dockerfile
  dockerCommand: python -m app.cloud_runtime
  autoDeployTrigger: commit
  healthCheckPath: /health/live
  maxShutdownDelaySeconds: 45
  envVars:
  - key: DATABASE_HOST
    sync: false
  - key: DATABASE_PORT
    sync: false
  - key: DATABASE_NAME
    sync: false
  - key: POSTGRES_RUNTIME_PASSWORD
    sync: false
  - key: REDIS_URL
    sync: false
  - key: JWT_SECRET
    sync: false
  - key: MFA_ENCRYPTION_KEY
    sync: false
  - key: ALLOWED_ORIGINS
    sync: false
  - key: ALLOWED_HOSTS
    sync: false
  - key: WEBAUTHN_RP_ID
    sync: false
  - key: ENVIRONMENT
    value: production
  - key: COOKIE_SECURE
    value: 'true'
  - key: API_DOCS_ENABLED
    value: 'false'
  - key: DEMO_MODE
    value: 'false'
  - key: SEED_DEMO
    value: 'false'
  - key: LIVE_MONITORING
    value: 'true'
  - key: LLM_PROVIDER
    value: offline
