map $http_upgrade $connection_upgrade { default upgrade; '' close; }
map $scheme $websocket_scheme { default ws; https wss; }
# Never interpolate an unvalidated Host value into a security policy.
map $http_host $websocket_authority {
    default "";
    "~^[a-zA-Z0-9.-]+(:[0-9]{1,5})?$" $http_host;
}
map $scheme $hsts_policy { default ""; https "max-age=31536000"; }
limit_req_zone $binary_remote_addr zone=api:10m rate=25r/s;
log_format sentinelx_json escape=json '{"timestamp":"$time_iso8601","ip":"$remote_addr","method":"$request_method","path":"$uri","http_status":$status,"request_id":"$request_id"}';
map "$request_method:$uri" $collect_access {
    default 1;
    ~^(GET|HEAD|OPTIONS):/api/ 0;
    ~^[A-Z]+:/(health|ws|assets)(/|$) 0;
    ~^[A-Z]+:/api/v1/(sources|events|dashboard|system)(/|$) 0;
    ~^[A-Z]+:/favicon.svg$ 0;
    ~^[A-Z]+:/third-party-notices.txt$ 0;
}

server {
    listen 8080;
    include /etc/nginx/sentinelx/server.conf;
}
