# Optional TLS listener; requires operator-provided trusted certificate files.
server {
    listen 8443 ssl;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:sentinelx_tls:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    include /etc/nginx/sentinelx/server.conf;
}
