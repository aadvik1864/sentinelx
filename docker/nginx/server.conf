server_name _;
server_tokens off;
access_log /dev/stdout sentinelx_json if=$collect_access;
client_max_body_size 256k;
include /etc/nginx/sentinelx/security-headers.conf;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' $websocket_scheme://$websocket_authority; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

location ~ (^|/)\. { return 404; }
location ~* ^/(backend|collectors|detection-rules|docker|frontend|scripts)(/|$) { return 404; }
location ~* ^/(docker-compose[^/]*\.ya?ml|package(-lock)?\.json|requirements\.txt|pyproject\.toml)$ { return 404; }

# Optional development-only Swagger; disabled in the backend by default.
location = /api/docs {
    limit_req zone=api burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    include /etc/nginx/sentinelx/security-headers.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; img-src 'self' https://fastapi.tiangolo.com data:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
}
location /api/v1/ai/ {
    limit_req zone=api burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 190s;
}
location /api/ {
    limit_req zone=api burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 70s;
}
location /ws/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 65s;
    proxy_buffering off;
}
location /health/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location / { proxy_pass http://frontend:8080; proxy_set_header Host $host; }
